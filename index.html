<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <header class="hero">
      <div class="hero-bar">
        <span class="icon-btn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></span>
        <h2 id="hero-date"></h2>
        <span class="icon-btn" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 1.5M9.5 3h5"/></svg></span>
      </div>
      <div class="hero-main">
        <div>
          <h1 id="hero-title">Today</h1>
          <p id="hero-sub" aria-live="polite"></p>
        </div>
        <button id="open-add" class="add-new" type="button">Add New</button>
      </div>
    </header>

    <section class="sheet">
      <div class="days" id="days" role="group" aria-label="Choose a day"></div>

      <div class="list-head">
        <h2>My Tasks</h2>
        <div class="seg" role="group" aria-label="Filter tasks">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">To do</button>
          <button type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
      </div>

      <ul id="list" class="list"></ul>
      <div id="empty" class="empty" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12.5l2.2 2.2L15.5 10M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/></svg>
        <p id="empty-text"></p>
      </div>
      <button id="clear-btn" class="clear" type="button">Clear completed</button>
    </section>

    <button id="fab" class="fab" type="button" aria-label="Add task"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

    <dialog id="dialog" aria-labelledby="dialog-title">
      <form id="task-form">
        <div class="dlg-head">
          <button type="button" id="close-dlg" class="back" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <h2 id="dialog-title">Create Task</h2>
        </div>
        <fieldset class="cats"><legend>Choose activity</legend><div id="cats"></div></fieldset>
        <label class="field">Name<input id="f-title" type="text" required maxlength="80" autocomplete="off"></label>
        <label class="field">Description<textarea id="f-desc" rows="2" maxlength="160"></textarea></label>
        <div class="row3">
          <label class="field">Date<input id="f-date" type="date" required></label>
          <label class="field">Start<input id="f-start" type="time" required></label>
          <label class="field">End<input id="f-end" type="time" required></label>
        </div>
        <p id="form-error" class="form-error" hidden>End time must be after the start time.</p>
        <button type="submit" class="create">Create Task</button>
      </form>
    </dialog>
  </main>
  <script src="script.js"></script>
</body>
</html>
